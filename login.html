<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; color: #111; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .header a { color: blue; text-decoration: none; margin-left: 0.75rem; font-size: 0.9rem; }
    .box { background: #fff; border: 1px solid #ccc; padding: 1rem; border-radius: 4px; }
    .field { margin-bottom: 0.75rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.45rem; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 0.5rem; background: blue; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #statusMsg { margin-top: 0.75rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Login</h2>
    <div>
      <a href="/register">Register</a>
      <a href="/calendar">Calendar</a>
    </div>
  </div>

  <div class="box">
    <form id="loginForm">
      <div class="field">
        <label for="regNo">Registration Number</label>
        <input type="number" id="regNo" name="reg_no" min="1" step="1" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Log In</button>
    </form>
    <p id="statusMsg"></p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const statusMsg = document.getElementById("statusMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusMsg.style.color = "#111";
      statusMsg.textContent = "";

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          reg_no: Number(document.getElementById("regNo").value),
          password: document.getElementById("password").value
        })
      });

      const bodyText = await res.text();
      if (!res.ok) {
        statusMsg.style.color = "red";
        statusMsg.textContent = bodyText || "Login failed.";
        return;
      }

      const data = JSON.parse(bodyText);
      if (data.token) {
        localStorage.setItem("token", data.token);
      }
      window.location.href = "/calendar";
    });
  </script>
</body>
</html>
